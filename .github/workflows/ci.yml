name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  check:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookmark_user
          POSTGRES_PASSWORD: bookmark_pass
          POSTGRES_DB: bookmark_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bookmark_user:bookmark_pass@localhost:5432/bookmark_manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Prisma Client generation
        run: bunx prisma generate

      - name: Run Prisma migrations
        run: bunx prisma migrate deploy

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run tests (unit + integration)
        run: bun test
